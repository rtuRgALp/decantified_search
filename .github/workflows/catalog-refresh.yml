name: Refresh public retailer catalogs
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require free standard-runner public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = false
      - name: Verify ingestion contracts
        run: python -m unittest discover -s tests -v
      - name: Refresh and validate catalogs
        run: python -m scripts.refresh_catalogs
      - name: Publish validated snapshots without overwriting remote changes
        run: |
          base_commit=$(git rev-parse HEAD)
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$base_commit" ]; then
            echo 'Main advanced; publication deferred to the next refresh.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add catalogs/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public retailer catalog snapshots'
          if ! git push origin HEAD:main; then
            echo 'Normal push rejected; no changes were overwritten. Next run will regenerate.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
